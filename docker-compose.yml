services:

  inference-api:
    build:
      context: .
      dockerfile: inference_api/Dockerfile
    container_name: invoice-inference
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/model/saved_model
      - S3_BUCKET=${S3_BUCKET:-invoice-intelligence-storage-2026}
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./ai/model/saved_model:/app/model/saved_model:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - invoice-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: invoice-backend
    ports:
      - "9000:8080"
    environment:
      - S3_BUCKET_NAME=${S3_BUCKET:-invoice-intelligence-storage-2026}
      - INFERENCE_API_URL=http://inference-api:8000
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-InvoicesTable}
      - PIPELINE_TABLE=${PIPELINE_TABLE:-invoice_pipeline}
      - SQS_QUEUE_URL=${SQS_QUEUE_URL:-}
      - DLQ_URL=${DLQ_URL:-}
    depends_on:
      inference-api:
        condition: service_healthy
    networks:
      - invoice-net
    restart: unless-stopped

networks:
  invoice-net:
    driver: bridge