# deployment/aws_config.yml
# Invoice Intelligence System — AWS Deployment Guide

aws:
  region: us-east-1

  s3:
    bucket_name: invoice-intelligence-storage-2026
    region: eu-north-1
    structure:
      - invoices/   # uploaded invoice images (UUID-prefixed keys)
      - ai/model/saved_model/  # LayoutLM fine-tuned model weights

  dynamodb:
    region: us-east-1
    tables:
      - name: InvoicesTable
        partition_key: id (String)
        description: Stores extracted invoice fields and status (PENDING / CONFIRMED)
      - name: invoice_pipeline
        partition_key: document_id (String)
        description: Pipeline Tracker — full stage history per invoice
      - name: Invoices
        partition_key: id (String)
        description: Legacy invoices table

  sqs:
    region: us-east-1
    queues:
      - name: InvoiceProcessingQueue
        description: Decouples upload from AI inference; retries up to 3 times
      - name: InvoiceProcessingDLQ
        description: Dead Letter Queue — receives failed invoices after 3 retries

  lambda:
    region: us-east-1
    function_name: InvoiceProcessor
    runtime: python3.11
    handler: main.handler
    trigger: API Gateway
    adapter: Mangum (FastAPI → Lambda)
    packaging: Docker container image via ECR
    env_vars:
      - S3_BUCKET_NAME: invoice-intelligence-storage-2026
      - INFERENCE_API_URL: <ecs-fargate-service-url>
      - AWS_REGION: us-east-1
      - DYNAMODB_TABLE: InvoicesTable
      - PIPELINE_TABLE: invoice_pipeline
      - SQS_QUEUE_URL: <sqs-queue-url>
      - DLQ_URL: <dlq-url>

  ecs_fargate:
    region: us-east-1
    service_name: invoice-inference
    description: Hosts LayoutLM inference API (FastAPI on port 8000)
    image_source: ECR
    port: 8000
    subnet: private (only reachable by Lambda)
    env_vars:
      - MODEL_PATH: /app/model/saved_model
      - S3_BUCKET: invoice-intelligence-storage-2026
      - AWS_REGION: eu-north-1

  ecr:
    region: us-east-1
    repositories:
      - invoice-backend    # Lambda container image
      - invoice-inference  # ECS Fargate inference container image

  cloudwatch:
    description: Logging and monitoring
    log_groups:
      - /aws/lambda/InvoiceProcessor
      - /ecs/invoice-inference
    alerts:
      - metric: Lambda error rate > 5%
      - metric: SQS queue depth > 100
      - metric: ECS container health failures


steps:

  1_build_and_push_inference:
    description: Build and push LayoutLM inference image to ECR
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin <account-id>.dkr.ecr.us-east-1.amazonaws.com
      - docker build -f inference_api/Dockerfile -t invoice-inference .
      - docker tag invoice-inference:latest <account-id>.dkr.ecr.us-east-1.amazonaws.com/invoice-inference:latest
      - docker push <account-id>.dkr.ecr.us-east-1.amazonaws.com/invoice-inference:latest

  2_deploy_ecs_fargate:
    description: Deploy inference API as ECS Fargate service (private subnet)
    commands:
      - "# Go to AWS Console > ECS > Create Cluster > Fargate"
      - "# Create Task Definition using ECR image: invoice-inference"
      - "# Set port 8000, assign private subnet, no public IP"
      - "# Create Service from task definition"

  3_build_and_push_backend:
    description: Build and push Lambda backend image to ECR
    commands:
      - docker build -f backend/Dockerfile -t invoice-backend .
      - docker tag invoice-backend:latest <account-id>.dkr.ecr.us-east-1.amazonaws.com/invoice-backend:latest
      - docker push <account-id>.dkr.ecr.us-east-1.amazonaws.com/invoice-backend:latest

  4_deploy_lambda:
    description: Deploy FastAPI backend as Lambda function
    commands:
      - "# Go to AWS Console > Lambda > Create Function > Container Image"
      - "# Select ECR image: invoice-backend"
      - "# Set handler: main.handler"
      - "# Add API Gateway trigger"
      - "# Set environment variables (S3, DynamoDB, SQS, INFERENCE_API_URL)"

  5_configure_sqs:
    description: Create processing queue and dead letter queue
    commands:
      - aws sqs create-queue --queue-name InvoiceProcessingDLQ
      - aws sqs create-queue --queue-name InvoiceProcessingQueue --attributes '{"RedrivePolicy":"{\"deadLetterTargetArn\":\"<dlq-arn>\",\"maxReceiveCount\":\"3\"}"}'

  6_verify:
    commands:
      - curl https://<api-gateway-url>/health
      - curl https://<api-gateway-url>/api/invoices
      - curl http://<ecs-service-url>:8000/health

  7_local_dev:
    description: Run locally using docker-compose (for development only)
    commands:
      - cp .env.example .env
      - "# Fill in AWS credentials in .env"
      - docker-compose up --build
      - "# Backend available at: http://localhost:9000"
      - "# Inference API at:     http://localhost:8000"
      - "# Dashboard at:         ai/Dashboard/index.html (open in browser)"