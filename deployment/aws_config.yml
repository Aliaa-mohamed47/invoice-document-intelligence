# deployment/aws_config.yml
# Aliaa — AWS Deployment Guide
# ─────────────────────────────────────────────────────────────────────────────
# Follow these steps in order to deploy the project on AWS
# ─────────────────────────────────────────────────────────────────────────────

aws:
  region: us-east-1

  # ── S3 Bucket ───────────────────────────────────────────────────────────────
  s3:
    bucket_name: invoice-intelligence-bucket
    # Create via AWS Console or CLI:
    # aws s3 mb s3://invoice-intelligence-bucket --region us-east-1


  # ── EC2 Instance ────────────────────────────────────────────────────────────
  ec2:
    instance_type: t2.medium
    ami: ami-0c02fb55956c7d316   # Amazon Linux 2023
    # free tier option: t2.micro (not recommended for model workloads)


  # ── Security Group Rules ────────────────────────────────────────────────────
  security_group:
    inbound:
      - port: 22
        source: your-ip/32

      - port: 8000
        source: 0.0.0.0/0   # inference API

      - port: 8080
        source: 0.0.0.0/0   # backend API

      - port: 5432
        source: sg-internal  # PostgreSQL (internal only)


# ─────────────────────────────────────────────────────────────────────────────
# Deployment Steps (ordered)
# ─────────────────────────────────────────────────────────────────────────────

steps:

  1_create_s3:
    commands:
      - aws s3 mb s3://invoice-intelligence-bucket --region us-east-1
      - aws s3api put-bucket-cors --bucket invoice-intelligence-bucket \
        --cors-configuration file://deployment/s3_cors.json


  2_launch_ec2:
    commands:
      - "# Go to AWS Console > EC2 > Launch Instance"
      - "# Select Amazon Linux 2023 + t2.medium"
      - "# Configure Security Group (ports 8000, 8080)"
      - "# Download key pair (.pem file)"


  3_connect_and_setup:
    commands:
      - ssh -i your-key.pem ec2-user@<ec2-public-ip>
      - sudo yum update -y
      - sudo yum install -y docker git
      - sudo systemctl start docker
      - sudo usermod -aG docker ec2-user

      - sudo curl -L https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m) \
        -o /usr/local/bin/docker-compose

      - sudo chmod +x /usr/local/bin/docker-compose


  4_deploy_project:
    commands:
      - git clone https://github.com/your-repo/invoice-intelligence.git
      - cd invoice-intelligence
      - cp .env.example .env
      - "# Edit environment variables"
      - nano .env
      - docker-compose up -d --build


  5_verify:
    commands:
      - docker-compose ps
      - curl http://localhost:8000/health
      - curl http://localhost:8080/api/invoices


  6_cloudwatch_monitoring:
    description: AWS CloudWatch logging and monitoring setup
    commands:
      - "# Go to AWS Console > CloudWatch > Log Groups"
      - "# Logs will appear automatically from containers"
      - "# Set alert: latency > 10 seconds"
      - "# Set alert: error rate > 5%"


# ─────────────────────────────────────────────────────────────────────────────
# Post-deployment URLs
# ─────────────────────────────────────────────────────────────────────────────

urls:
  inference_api: "http://<ec2-public-ip>:8000"
  inference_docs: "http://<ec2-public-ip>:8000/docs"
  backend_api: "http://<ec2-public-ip>:8080/api/invoices"